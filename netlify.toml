# Preview / alternate hosting. Production remains Vercel (vercel.json).
[build]
  command = "npm run build"
  publish = "build"

[[redirects]]
  from = "/gold"
  to = "/"
  status = 301

[[redirects]]
  from = "/gold/*"
  to = "/"
  status = 301

# SPA fallback for client routes (API stays on Vercel in production).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
