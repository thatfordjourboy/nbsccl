<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Per-route title/description/canonical/og:* are rewritten at build time by scripts/prerender.mjs
         and at runtime by src/components/Seo.tsx. Security headers (CSP etc.) live in vercel.json. -->
    <!-- __SITE_URL__ and per-route values are filled in at build time by scripts/prerender.mjs,
         and kept in sync on client-side navigation by src/components/Seo.tsx. Security headers live in vercel.json. -->
    <title>NB Sebastian Commodities Company Ltd, Accra, Ghana</title>
    <meta name="description" content="" />
    <link rel="canonical" href="__SITE_URL__/" />
    <meta name="theme-color" content="#1e3a32" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NB Sebastian Commodities Company" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="" />
    <meta property="og:description" content="" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="" />
    <meta name="twitter:description" content="" />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
    <meta name="twitter:image:alt" content="" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": ["Organization", "LocalBusiness"],
            "@id": "__SITE_URL__/#organization",
            "name": "NB Sebastian Commodities Company Limited",
            "alternateName": ["NB Sebastian", "NBSCCL"],
            "url": "__SITE_URL__/",
            "logo": "__SITE_URL__/apple-touch-icon.png",
            "image": "__SITE_URL__/og-image.png",
            "description": "Construction, commodities trading, import and export, gold purchasing, manufacturing and general merchandise from Accra, Ghana.",
            "telephone": "+233200252498",
            "email": "info@nbsebastian.com",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "Behind Inkoom Hospital, Spintex Road (GhanaPostGPS G6-166-0779)",
              "addressLocality": "Accra",
              "addressRegion": "Greater Accra",
              "addressCountry": "GH"
            },
            "openingHoursSpecification": [
              { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"], "opens": "08:30", "closes": "17:00" },
              { "@type": "OpeningHoursSpecification", "dayOfWeek": "Saturday", "opens": "10:00", "closes": "16:00" }
            ],
            "contactPoint": [
              { "@type": "ContactPoint", "telephone": "+233200252498", "contactType": "customer service", "areaServed": "GH", "availableLanguage": "English" },
              { "@type": "ContactPoint", "telephone": "+233550974525", "contactType": "sales", "areaServed": "GH", "availableLanguage": "English" }
            ]
          },
          {
            "@type": "WebSite",
            "@id": "__SITE_URL__/#website",
            "url": "__SITE_URL__/",
            "name": "NB Sebastian Commodities Company",
            "publisher": { "@id": "__SITE_URL__/#organization" },
            "inLanguage": "en"
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
