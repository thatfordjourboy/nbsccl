<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Per-route title/description/canonical/og:* are rewritten at build time by scripts/prerender.mjs
         and at runtime by src/components/Seo.tsx. Security headers (CSP etc.) live in vercel.json. -->
    <title>NB Sebastian Commodities Company Ltd.</title>
    <meta name="description" content="NB Sebastian Commodities Company: construction, commodities trading, freight, gold purchasing, manufacturing and merchandise from Accra, Ghana." />
    <link rel="canonical" href="https://www.nbsccl.com/" />
    <meta name="theme-color" content="#1e3a32" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NB Sebastian" />
    <meta property="og:title" content="NB Sebastian Commodities Company Ltd." />
    <meta property="og:description" content="NB Sebastian Commodities Company: construction, commodities trading, freight, gold purchasing, manufacturing and merchandise from Accra, Ghana." />
    <meta property="og:url" content="https://www.nbsccl.com/" />
    <meta property="og:image" content="https://www.nbsccl.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NB Sebastian Commodities Company Ltd." />
    <meta name="twitter:description" content="NB Sebastian Commodities Company: construction, commodities trading, freight, gold purchasing, manufacturing and merchandise from Accra, Ghana." />
    <meta name="twitter:image" content="https://www.nbsccl.com/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "NB Sebastian Commodities Company Ltd.",
        "url": "https://www.nbsccl.com",
        "logo": "https://www.nbsccl.com/og-image.png",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Behind Inkoom Hospital, Spintex Road (G6-166-0779)",
          "addressLocality": "Accra",
          "addressCountry": "GH"
        },
        "contactPoint": [{
          "@type": "ContactPoint",
          "telephone": "+233200252498",
          "contactType": "customer service",
          "areaServed": "GH"
        }]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
